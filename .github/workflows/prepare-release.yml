name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Type of version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  attestations: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release candidate
        run: |
          pnpm lint
          pnpm typecheck
          pnpm typecheck:build
          pnpm test:coverage
          pnpm build
          pnpm publint
          pnpm attw
          pnpm package:smoke
          pnpm docs:build

      - name: Create and push version commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm exec bumpp -r "${{ inputs.bump_type }}" -y

      - name: Establish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t tags < <(git tag --points-at HEAD --list 'v*')
          if [[ "${#tags[@]}" -ne 1 ]]; then
            echo "Expected exactly one v* tag at HEAD; found ${#tags[@]}." >&2
            exit 1
          fi

          tag="${tags[0]}"
          commit="$(git rev-parse HEAD)"
          remote_commit="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{ print $1 }')"
          if [[ -z "${remote_commit}" ]]; then
            remote_commit="$(git ls-remote origin "refs/tags/${tag}" | awk '{ print $1 }')"
          fi
          if [[ "${remote_commit}" != "${commit}" ]]; then
            echo "Remote tag ${tag} does not resolve to release commit ${commit}." >&2
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists; verifying immutability."
          else
            gh release create "${tag}" --verify-tag --generate-notes --fail-on-no-commits
          fi

          if [[ "$(gh release view "${tag}" --json isImmutable --jq '.isImmutable')" != "true" ]]; then
            echo "GitHub release ${tag} is not immutable. Enable release immutability in repository settings before publishing." >&2
            exit 1
          fi
          gh release verify "${tag}" >/dev/null

          remote_commit="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{ print $1 }')"
          if [[ -z "${remote_commit}" ]]; then
            remote_commit="$(git ls-remote origin "refs/tags/${tag}" | awk '{ print $1 }')"
          fi
          if [[ "${remote_commit}" != "${commit}" ]]; then
            echo "Immutable release tag ${tag} does not resolve to prepared commit ${commit}." >&2
            exit 1
          fi

          node -e "require('node:fs').writeFileSync('release-metadata.json', JSON.stringify({ tag: process.argv[1], commit: process.argv[2] }, null, 2) + '\n')" "${tag}" "${commit}"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata.json
          if-no-files-found: error
          retention-days: 7
